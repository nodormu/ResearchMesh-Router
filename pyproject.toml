[project]
name = "ResearchMesh-Router"
version = "0.1.0"
description = "A CLI orchestrator that routes work across a fleet of ResearchMesh MCP workers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"   # tomllib (used by main.py) is stdlib only from 3.11
# Every dependency here is required by the tool it backs. The array is flat, as in
# ResearchMesh/-Windows/-Mac. CI (.github/workflows/ci.yml) installs its own
# narrower package list and does not use this file.
dependencies = [
    "anthropic>=1,<2",
    "mcp[cli]>=2.0,<3",     # 2.0 is a breaking major — see requirements.txt
    "prompt-toolkit>=3.0.51",
    "pydantic>=2.0",
    "playwright>=1.40.0",     # browser_*
    # Local tool backings — imported lazily by the tool that needs them.
    "jupyter_client>=8.9.1",  # python — CurveZMQ encryption; see requirements.txt
    "ipykernel>=7.0",
    "pexpect>=4.9",           # interactive_run
    "ruamel.yaml>=0.18",      # config_edit
    "tomlkit>=0.12",
    "jsonpath-ng>=1.6",
    "duckdb>=0.10",           # sql_query
    "send2trash>=1.8",        # trash
    "pyautogui>=0.9.54",      # computer
    "pillow>=10.0",
    "dbus-next>=0.2.3",       # computer on Wayland, desktop_window
    "httpx2",                 # text_embeddings/vision_query — already pulled in
                              # transitively by both anthropic and mcp, listed
                              # explicitly since these modules import it directly
    "piper-tts",              # speak — see requirements.txt for the full note
    "faster-whisper",         # listen — see requirements.txt for the full note
    "ruff>=0.16",             # linter; see requirements.txt
    "mypy>=2.0",              # type checker, a CI gate; see requirements.txt
]

# `computer`, `document_convert`, `screen_find`, `speak` and `listen` also need apt
# packages (python3-tk, scrot, libreoffice, pandoc, tesseract-ocr, xvfb,
# pulseaudio-utils), and `browser_*` needs `playwright install chromium`; none of
# that can be expressed here. See requirements.txt.

# `ruff check .` should come back clean — that is the bar for an edit here, the
# same as in ResearchMesh. This section adds no rules; it only lists exemptions.
#
# `select` is intentionally left at ruff's defaults rather than pinned. Those
# defaults do change between ruff versions, so a new release may surface new
# findings — that is the intended behaviour: you get told about the new rule,
# and the exemptions below still hold. Triage a new finding rather than assuming
# it is more of the same.
[tool.ruff]
# scripts/ is gitignored (machine-local convenience tooling assuming sibling
# repo clones that only exist on this dev box -- see its own .gitignore entry)
# but still a real directory `ruff check .` would otherwise see and lint. A
# fresh clone never has this directory at all, so real CI never lints it --
# excluding it here keeps a local run matching what CI actually checks.
exclude = ["scripts"]

[tool.ruff.lint]
ignore = [
    # Blanket `except Exception` is deliberate: a worker on another machine can
    # fail in any way, and every tool_use block owes the API a tool_result in the
    # next message. An exception that escapes poisons every later request in the
    # session with a 400 about unresolved tool_use ids.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# One blocking `open()` reads config.toml at the top of a standalone diagnostic
# script; there is no concurrent work to starve.
"mcp_client.py" = ["ASYNC230"]

# `mypy .` should come back clean, the same bar as `ruff check .`.
#
# The failure mode it guards is a dependency changing underneath this code: mypy
# type-checks against the *installed* packages, and core/tools.py reads snake_case
# attributes off MCP models whose camelCase spellings survive only as
# serialization aliases, so an SDK mismatch is a runtime AttributeError on the
# first real call that no import check reaches. Left at mypy's defaults, which
# skip the bodies of unannotated functions: a floor, not a straitjacket.
[tool.mypy]
# scripts/ is gitignored and absent from a fresh clone, as in [tool.ruff]'s exclude.
exclude = "^scripts/"
# CI installs only the four core packages, so the local-tool backings are absent
# there; a missing import is not an error.
ignore_missing_imports = true
