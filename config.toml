# ResearchMesh-Router — configuration.
#
# Non-secret settings only. Bearer tokens are NOT stored here: each worker names
# the environment variable that holds its token (see README.md).

[claude]
# Anthropic model to use. The CLAUDE_MODEL environment variable overrides this.
model = "claude-sonnet-5"

[router]
# How many workers may be busy at the same time.
#
# Tool calls are grouped by worker: the groups run concurrently, and calls
# within one group run in order. That mirrors the workers themselves — a
# ResearchMesh worker serialises its `delegate` calls behind a lock because it
# has one mouse, one browser page and one IPython kernel — so this number is
# effectively "how many machines at once", not "how many calls at once".
max_parallel = 8

# Default deadline for a single call to a worker, in seconds.
#
# 900 is not arbitrary and the default is not safe to keep: the MCP SDK's own
# default read timeout is 300s, and a worker driving a desktop GUI routinely
# runs longer than that. When it expires the work is already done on the far
# side and simply lost. Override per worker below with `timeout_seconds`.
timeout_seconds = 900

[mcp]
# Set enabled = false to skip every worker. The router has no tools of its own,
# so with no workers it can only hold a conversation.
enabled = true

# The fleet. Every reachable worker connects and its tools are merged into the
# single list Claude sees; one that fails prints a warning and is skipped, so a
# machine being switched off doesn't stop the router.
#
# Tool names are namespaced as `<name>__<tool>` before being declared, which is
# what makes a fleet of identical ResearchMesh workers possible at all — three
# workers all exposing `delegate` would otherwise be rejected outright with
# `400 tools: Tool names must be unique`. Keep `name` short, and use only
# letters, digits, `_` and `-`: anything else is substituted with `_` to satisfy
# the API's tool-name rules, so `gpu box` and `gpu-box` would collide.
#
# Two entry shapes:
#
# 1) Streamable HTTP — a worker already running on another machine:
#   name             label; becomes the tool-name prefix and the [worker: ...] tag
#   url              the worker's Streamable HTTP endpoint
#   description      what this machine is FOR — see the note below
#   token_env        optional; the environment variable holding this worker's
#                    bearer token. Omit for an unauthenticated worker. Never put
#                    the token itself here; this file is committed.
#   timeout_seconds  optional; overrides [router] timeout_seconds
#   enabled          optional, default true — park a worker without deleting it
#
# 2) stdio — a worker this process launches itself as a subprocess (no port):
#   name, description, timeout_seconds, enabled  as above
#   command          full argv as a list, e.g. ["python", "/path/mcp_server.py"]
#   env              optional table of extra environment variables
#
# `description` is the field that makes the fleet navigable, and it is the one
# thing you cannot skip. ResearchMesh's mcp_server.py hardcodes a single
# description constant, so every worker in the fleet describes itself with
# byte-identical text; namespacing gives them distinct *names* but nothing to
# choose between. Write what is true of that machine specifically and would
# change the routing decision — its OS and session type, what is installed, what
# is plugged into it, what data lives on it, what it must not be used for.
#
# Paths and URLs are expanded before use: `~`, `$USER`, `$HOME`, `${VAR}` in
# `command`, `url` and the *values* of `env` are substituted from the
# environment. `env`'s keys and `description` are left alone. An undefined
# variable is left as written rather than becoming empty, so a typo shows up in
# the startup warning instead of producing a silently wrong path.
#
# Note the trailing slash on the URLs. Starlette 307-redirects `/mcp` to `/mcp/`
# before the auth middleware runs, so the un-slashed form works but takes an
# extra round trip on every request.
#
# Every entry below is an example and is commented out, so a fresh clone starts
# clean. Replace them with your own machines.
servers = [
#  { name = "workstation",
#    url = "http://192.168.2.20:8100/mcp/",
#    token_env = "RESEARCHMESH_MCP_TOKEN",
#    description = "Linux desktop on a real Xorg session, so it is the only worker whose `computer` tool works. Unreal Engine 5.8.1 and Blender are installed. Use it for anything that has to be seen or clicked on a real screen.",
#    timeout_seconds = 1800 },
#
#  { name = "gpu-box",
#    url = "http://192.168.2.31:8100/mcp/",
#    token_env = "GPU_BOX_MCP_TOKEN",
#    description = "Headless Linux, no display at all — GUI tasks will fail here. Has the CUDA stack and the training datasets under /data. Use it for long compute, model runs, and SQL over the parquet files in /data/warehouse.",
#    timeout_seconds = 3600 },
#
#  { name = "scraper",
#    url = "http://192.168.2.44:8100/mcp/",
#    description = "Headless Linux on a separate consumer connection, deliberately outside the office egress IP. Use it for browsing and page extraction. No project source and no credentials on this box.",
#    timeout_seconds = 600 },
#
#  { name = "local",
#    command = ["python", "/run/media/$USER/POD2/Anthropic/ResearchMesh/mcp_server.py"],
#    description = "A ResearchMesh worker on this same machine, launched as a subprocess. Shares this filesystem, so it is the one worker that can see the files you are looking at.",
#    env = { ANTHROPIC_API_KEY = "$ANTHROPIC_API_KEY" } },
]

[embeddings]
# There is no Anthropic-hosted embeddings endpoint — the documented path is
# Voyage AI, a separate paid API. The `text_embeddings` tool exists so Claude
# has vector embeddings available at all without adding that second bill:
# uncomment `url` below and it calls whatever HTTP embedding server you
# already run instead — the same private compute an Unreal Engine project's
# own embedding settings might already point at, or any self-hosted server
# speaking the common OpenAI-compatible `/v1/embeddings` shape
# (text-embeddings-inference, llama.cpp's server, Ollama, vLLM, LM Studio, ...).
#
# Like everything else in this file, it's read fresh on every call — editing
# this block (by hand or with the `config_edit` tool) and calling
# `text_embeddings` again picks it up with no restart.
#
#   url             your embedding server's endpoint. Required — the tool is
#                   still declared to Claude either way, but returns an error
#                   telling you to set this until you do.
#   model           optional model name forwarded in the request body. Most
#                   single-model private servers ignore it; leave it unset if
#                   yours does. Overridable per call.
#   request_format  "openai" (default) posts {"input": [...], "model": ...}
#                   and expects {"data": [{"embedding": [...]}, ...]} back —
#                   the shape most self-hosted servers speak. "simple" posts
#                   {"text": [...]} instead, for a bespoke server that wants
#                   that shape. Either way, a response of
#                   {"embedding": [...]} or {"embeddings": [[...]]} is also
#                   accepted regardless of which format was sent.
#   api_key_env     optional — name of the environment variable holding a
#                   bearer token for this server, the same `token_env`
#                   pattern an `[mcp].servers` entry uses. Never put the
#                   token itself here; this file is committed.
#   timeout         optional request timeout in seconds (default 30).
#
# Nothing above is specific to self-hosted compute — it's the same generic
# OpenAI-compatible /v1/embeddings shape, so a paid provider works with zero
# code changes too. Voyage AI is one example:
#
#   url = "https://api.voyageai.com/v1/embeddings"
#   model = "voyage-2"                  # or voyage-3.5, voyage-large-2, ...
#   api_key_env = "VOYAGE_API_KEY"      # set VOYAGE_API_KEY in your shell,
#                                        # never here — this file is committed
#
# The example below instead points at a self-hosted server on the LAN — swap
# in whatever you actually run:
# url = "http://192.168.2.12:8080/v1/embeddings"
# model = "nomic-embed"
# request_format = "openai"
# api_key_env = "EMBEDDINGS_API_KEY"
# timeout = 30

[vision]
# Same self-hosting motivation as [embeddings] above, for a different
# modality: the `vision_query` tool asks a question about an image via your
# own OpenAI-compatible vision-capable chat server (llama.cpp's server,
# vLLM, LM Studio, ...) instead of sending the image to Anthropic's API.
#
# Like [embeddings], this is read fresh on every call — editing this block
# and calling `vision_query` again picks it up with no restart.
#
# IMPORTANT — no automatic fallback to Claude's own vision lives in this
# tool. If url is unset here, or the request to it fails (server down,
# unreachable, etc.), vision_query returns a plain
# {"status": "local_unavailable", ...} result and stops — it does NOT
# silently retry via Claude. Using Claude's own vision on the same image
# after that is a deliberate, separate decision made in conversation (with
# your explicit go-ahead), never automatic — see core/vision.py's module
# docstring for the full reasoning.
#
#   url          your vision server's OpenAI-compatible chat endpoint,
#                e.g. http://host:port/v1/chat/completions. Required — the
#                tool is still declared to Claude either way, but returns
#                a local_unavailable status telling you to set this until
#                you do.
#   model        model name forwarded in the request body — must match
#                your server's routing/alias name (e.g. a models.ini
#                bracket name in llama.cpp router mode), not necessarily
#                the .gguf filename. Overridable per call.
#   max_tokens   default max output tokens (default 4000 if unset here).
#                Confirmed empirically necessary at this magnitude for
#                GLM-4.6V-Flash specifically: it's a reasoning model that
#                spends part of the budget on invisible reasoning_content
#                before writing the visible answer — at low values
#                (tested: 400-500) it can burn the ENTIRE budget on
#                reasoning and return an empty or mid-sentence-truncated
#                answer with no error, only a "finish_reason": "length" in
#                the raw response to tell you why. If you swap in a
#                non-reasoning vision model later, a much lower value would
#                likely be fine — this default is tuned for THIS model,
#                not a universal constant. Overridable per call.
#   timeout      request timeout in seconds (default 180 if unset here).
#                Real test data point: max_tokens=4000 on a moderately
#                complex image used 1536 tokens and took 43s on the
#                7800 XT this was tuned against (~35.7 tok/s combined
#                reasoning+generation) — a call that actually used the
#                FULL 4000-token budget would extrapolate to roughly
#                110s, so 180s leaves real headroom rather than cutting it
#                close. Adjust freely if your hardware/model differs.
#   api_key_env  optional — same bearer-token env-var pattern as
#                [embeddings].api_key_env. Never put the token itself
#                here; this file is committed.
#
# The example below points at the same self-hosted llama.cpp router
# [embeddings] above already uses, now also serving a vision-capable model
# alongside the embedding one (llama.cpp's own router/--models-preset mode
# runs both behind one port) — swap in whatever you actually run:
# url = "http://192.168.2.12:8080/v1/chat/completions"
# model = "glm-4.6v-flash"
# max_tokens = 4000
# timeout = 180
# api_key_env = "VISION_API_KEY"
