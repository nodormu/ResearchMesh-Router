# ResearchMesh-Router — configuration.
#
# Non-secret settings only. Bearer tokens are NOT stored here: each worker names
# the environment variable that holds its token (see README.md).

[claude]
# Models for /model. This array is a cache: core/claude.py's
# refresh_claude_models() scans Anthropic's /v1/models once model_scan_ttl_hours
# has passed and rewrites it here, one entry per model family, newest first,
# sonnet first when present. A new session starts on the first entry.
# `/model swap <name/index>` changes only the router's own model, for the
# session, and never edits this file. A hand edit (e.g. to pin a dated
# snapshot) lasts until the next scan.
claude_models = ["claude-sonnet-5-5", "claude-opus-5-5", "claude-fable-5-1", "claude-haiku-4-5-20251001"]

# Written by refresh_claude_models() after each successful scan. Delete this line
# to force a rescan at the next startup.
# claude_models_checked_at = "2026-01-01T00:00:00+00:00"

# Hours a scan result is trusted before the next scan (default 24).
model_scan_ttl_hours = 24
claude_models_checked_at = "2026-10-04T16:56:18.629604+00:00"

[bash]
# Shell for the local `bash` tool, `bash_session` and `interactive_run`: an
# absolute path or a bare name resolved via $PATH. Unset, blank or unresolvable
# falls back to /bin/bash. Python's shell=True alone would use /bin/sh, which is
# dash on Ubuntu/Debian and breaks bash-only syntax ([[ ]], process
# substitution, arrays). If it resolves to zsh, apply_shell_prelude() in
# core/claude_learned_schemas.py restores bash-style word splitting and glob
# no-match behavior; zsh's 1-based array indices remain a difference (KSH_ARRAYS
# would fix them but changes more). Resolved once at start; restart to change.
shell = "/bin/bash"

[router]
# How many workers may be busy at once. Calls are grouped by worker: groups run
# concurrently and calls within a group run in order, because a ResearchMesh
# worker serialises `delegate` behind a lock (one mouse, one browser page, one
# IPython kernel). So this is how many machines at once, not how many calls.
max_parallel = 8

# Default deadline for one call to a worker, in seconds. The MCP SDK's own read
# timeout is 300s, and a worker driving a desktop GUI runs longer; when the
# deadline expires the work is already done on the far side and lost. Override
# per worker with `timeout_seconds`.
timeout_seconds = 900

[mcp]
# false skips every worker, leaving only the router's own local tools.
enabled = false

# The fleet. Every reachable worker connects and its tools join the single list
# Claude sees; one that fails prints a warning and is skipped.
#
# Tool names are namespaced `<name>__<tool>`: three workers all exposing
# `delegate` would otherwise be rejected with `400 tools: Tool names must be
# unique`. Use only letters, digits, `_` and `-` in `name`; anything else becomes
# `_`, so `gpu box` and `gpu.box` collide, and a collision gets a numeric suffix.
#
# Two entry shapes:
#
# 1) Streamable HTTP — a worker already running on another machine:
#   name             label; becomes the tool-name prefix and the [worker: ...] tag
#   url              the worker's Streamable HTTP endpoint
#   description      what this machine is FOR — see the note below
#   token_env        not required; the environment variable holding this worker's
#                    bearer token. Omit for an unauthenticated worker. Never put
#                    the token itself here; this file is committed.
#   timeout_seconds  not required; overrides [router] timeout_seconds
#   enabled          not required, default true — park a worker without deleting it
#
# 2) stdio — a worker this process launches itself as a subprocess (no port):
#   name, description, timeout_seconds, enabled  as above
#   command          full argv as a list, e.g. ["python", "/path/mcp_server.py"]
#   env              table of extra environment variables, if needed
#
# Set `description` on every worker. ResearchMesh's mcp_server.py hardcodes one
# description, so every worker describes itself identically. Write what is true
# of that machine and would change a routing decision: OS and session type, what
# is installed or attached, what data lives on it, what it must not be used for.
#
# `~`, `$USER`, `$HOME` and `${VAR}` in `command`, `url` and the *values* of
# `env` are expanded from the environment. `env` keys and `description` are left
# alone. An undefined variable is left as written, so a typo shows up in the
# startup warning.
#
# Keep the trailing slash on URLs: Starlette 307-redirects `/mcp` to `/mcp/`
# before the auth middleware runs, costing an extra round trip per request.
#
# The workstation, gpu-box and scraper entries are commented-out examples;
# `local` is live but inert while `enabled = false`.
servers = [
#  { name = "workstation",
#    url = "http://192.168.2.20:8100/mcp/",
#    token_env = "RESEARCHMESH_MCP_TOKEN",
#    description = "Linux desktop on a real Xorg session, so it is the only worker whose `computer` tool works. Unreal Engine 5.8.1 and Blender are installed. Use it for anything that has to be seen or clicked on a real screen.",
#    timeout_seconds = 1800 },
#
#  { name = "gpu-box",
#    url = "http://192.168.2.31:8100/mcp/",
#    token_env = "GPU_BOX_MCP_TOKEN",
#    description = "Headless Linux, no display at all — GUI tasks will fail here. Has the CUDA stack and the training datasets under /data. Use it for long compute, model runs, and SQL over the parquet files in /data/warehouse.",
#    timeout_seconds = 3600 },
#
#  { name = "scraper",
#    url = "http://192.168.2.44:8100/mcp/",
#    description = "Headless Linux on a separate consumer connection, deliberately outside the office egress IP. Use it for browsing and page extraction. No project source and no credentials on this box.",
#    timeout_seconds = 600 },
#
  { name = "local", command = ["python", "/run/media/$USER/POD2/Anthropic/ResearchMesh/mcp_server.py"], description = "A ResearchMesh worker on this same machine, launched as a subprocess. Shares this filesystem, so it is the one worker that can see the files you are looking at.", env = { ANTHROPIC_API_KEY = "$ANTHROPIC_API_KEY" } },
]

[embeddings]
# `text_embeddings` calls an HTTP embedding server you run or pay for; Anthropic
# has no embeddings endpoint. Any server speaking the OpenAI-compatible
# `/v1/embeddings` shape works (text-embeddings-inference, llama.cpp's server,
# Ollama, vLLM, LM Studio, a paid provider). Read from disk on every call, so an
# edit applies without a restart.
#
#   url             the server's endpoint. Required; until it is set the tool
#                   returns an error naming this key.
#   model           model name forwarded in the request body. Most single-model
#                   servers ignore it. Overridable per call.
#   request_format  "openai" (default) posts {"input": [...], "model": ...} and
#                   expects {"data": [{"embedding": [...]}, ...]}. "simple" posts
#                   {"text": [...]}. A response of {"embedding": [...]} or
#                   {"embeddings": [[...]]} is accepted with either format.
#   api_key_env     name of the environment variable holding a bearer token,
#                   like `token_env` in an `[mcp].servers` entry. Never put the
#                   token here; this file is committed.
#   timeout         request timeout in seconds (default 30).
#
# Voyage AI:
#   url = "https://api.voyageai.com/v1/embeddings"
#   model = "voyage-2"
#   api_key_env = "VOYAGE_API_KEY"
#
# A server on the LAN:
# url = "http://192.168.2.12:8080/v1/embeddings"
# model = "nomic-embed"
# request_format = "openai"
# api_key_env = "EMBEDDINGS_API_KEY"
# timeout = 30

[vision]
# `vision_query` asks about an image through an OpenAI-compatible vision chat
# server you run (llama.cpp's server, vLLM, LM Studio, ...) instead of sending
# the image to Anthropic. Read from disk on every call.
#
# There is no fallback to Claude's own vision. If `url` is unset or the request
# fails, the tool returns {"status": "local_unavailable", ...} and stops; using
# Claude's vision on the same image is a separate decision made in conversation.
#
#   url          the server's chat endpoint, e.g.
#                http://host:port/v1/chat/completions. Required; until it is set
#                the tool returns local_unavailable.
#   model        model name forwarded in the request body; it must match the
#                server's routing name, not necessarily the file name.
#                Overridable per call.
#   max_tokens   max output tokens (default 4000). A reasoning vision model
#                spends part of the budget on invisible reasoning_content; a low
#                value can use all of it and return an empty or truncated answer
#                with "finish_reason": "length". Overridable per call.
#   timeout      request timeout in seconds (default 180).
#   api_key_env  as for [embeddings].
#
# Example, for a llama.cpp router that also serves the embedding model above:
# url = "http://192.168.2.12:8080/v1/chat/completions"
# model = "glm-4.6v-flash"
# max_tokens = 4000
# timeout = 180
# api_key_env = "VISION_API_KEY"

[speak]
# `speak`: local text-to-speech through Piper (PyPI `piper-tts`, not
# `sudo apt install piper`, which installs an unrelated GTK app for configuring
# gaming mice). No cloud TTS API. Read from disk on every call.
#
#   enabled       default true. A hard off-switch checked before voice_model, so
#                 a disabled tool touches no filesystem and spawns no process.
#   voice_model   path to a Piper .onnx voice file with a matching <path>.json
#                 next to it. Required; until it is set the tool returns
#                 not_configured.
#   sink          PipeWire sink name (`pactl list sinks short`); the system
#                 default if unset.
#   timeout       seconds for synthesis and for playback, each (default 30).
#
# To fill these in, ask Claude: it can run `pactl list sinks short` and edit this
# file with `config_edit`, which keeps the comments. The values below are
# examples for one machine, not defaults.
# enabled = true
# voice_model = "/home/invent/models/piper_voices/en_US-lessac-medium.onnx"
# sink = "alsa_output.usb-Razer_Razer_USB_Sound_Card_00000000-00.analog-stereo"
# timeout = 120

[listen]
# `listen`: local speech-to-text through faster-whisper (CTranslate2, on CPU).
# Read from disk on every call.
#
#   enabled       default true; checked before `device`, so a disabled tool never
#                 opens the microphone.
#   device        PipeWire source name (`pactl list sources short`). Required;
#                 until it is set the tool returns not_configured.
#   model_size    faster-whisper model size: tiny, base, small, medium or
#                 large-v3 (default base).
#   default_duration_seconds   recording length when the caller gives none (8).
#   max_duration_seconds       cap on any requested duration (30).
#
# To fill these in, ask Claude: it can run `pactl list sources short` and edit
# this file with `config_edit`. The values below are examples for one machine,
# not defaults.
# enabled = true
# device = "alsa_input.usb-Razer_Razer_USB_Sound_Card_00000000-00.analog-stereo"
# model_size = "base"
# default_duration_seconds = 8
# max_duration_seconds = 30
